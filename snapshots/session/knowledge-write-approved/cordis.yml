# The ordinary headless composition plus the knowledge store, its write guard,
# and the knowledge tools in read-write mode. Under workspace-write the approval
# policy asks, and a fixture answerer allows the knowledge_write once, so the
# page is written.

- insert:
    - id: approval-fixture
      name: './approval-fixture.mjs'
    - id: knowledge-wiki-filesystem
      name: '@deepseek-ai/dsh-experimental-knowledge-wiki-filesystem'
      config:
        root: knowledge
    - id: knowledge-rules
      name: '@deepseek-ai/dsh-experimental-knowledge-rules'
      config:
        shellTools: [bash, pwsh]
    - id: tool-knowledge
      name: '@deepseek-ai/dsh-experimental-tool-knowledge'
      config:
        mode: read-write
        evidenceTools: [read]
        maxResults: 10
        maxPageChars: 20000
        maxDepth: 2
