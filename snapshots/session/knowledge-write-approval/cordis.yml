# The ordinary headless composition plus the knowledge store, its write guard,
# and the knowledge tools in read-write mode. The model reads a source file and
# asks knowledge_write to record it; the headless approval policy rejects the write.

- insert:
    - id: knowledge-wiki-filesystem
      name: '@deepseek-ai/dsh-experimental-knowledge-wiki-filesystem'
      config:
        root: knowledge
    - id: knowledge-rules
      name: '@deepseek-ai/dsh-experimental-knowledge-rules'
      config:
        shellTools: [bash, pwsh]
    - id: tool-knowledge
      name: '@deepseek-ai/dsh-experimental-tool-knowledge'
      config:
        mode: read-write
        evidenceTools: [read]
        maxResults: 10
        maxPageChars: 20000
        maxDepth: 2
