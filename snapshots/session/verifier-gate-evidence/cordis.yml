# The ordinary headless composition plus the graph projection and the verifier
# gate enforcing only its evidence check (no verify commands): an answer that
# names a path no tool record of the turn shows is steered once.

- insert:
    - id: graph-projection
      name: '@deepseek-ai/dsh-experimental-graph-projection'
    - id: verifier-gate
      name: '@deepseek-ai/dsh-experimental-verifier-gate'
      config:
        mode: enforce
        assumption: "the model names files in its answer that it never looked at"
        evidence: { mode: enforce }
