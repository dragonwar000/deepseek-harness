# Proactive compaction whose checkpoint quotes the human request verbatim.

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 8382
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1500
    retainTokens: 20
    authoritativeRequest:
      mode: split
      maxChars: 300
